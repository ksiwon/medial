<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MEDial 연구 시뮬레이터</title>
    <!-- Inline so there is no second file to serve and no 404 in the console. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2325665B'/%3E%3Ccircle cx='16' cy='16' r='5.5' fill='%23fff'/%3E%3C/svg%3E"
    />
    <style>
      /* The default 8px body margin turned every full-height screen into a
         1448px-wide document at 1440, which is a horizontal scrollbar on the
         default view. */
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        /* Same stack as the app root, so any text outside it - an error boundary,
           a bare fallback - is not rendered in the browser's serif default. */
        font-family: system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic',
          'Apple SD Gothic Neo', Roboto, sans-serif;
        background: #f7f8fa;
        -webkit-font-smoothing: antialiased;
      }
      #root {
        min-height: 100vh;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
